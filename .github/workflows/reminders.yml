name: Send due reminders

# Vercel's Hobby plan allows one cron run per day, which is useless for
# reminders. GitHub Actions is free and unlimited on public repositories, so it
# drives the job instead.
#
# ---- Why this loops instead of just scheduling every few minutes ----
#
# GitHub's `schedule:` trigger is best-effort and documented as such. A
# workflow asking for */10 routinely fires twenty minutes late, and during
# platform peaks the run is dropped entirely rather than queued. A class
# reminder has a lead time of fifteen minutes, so a dropped trigger meant the
# class was simply never announced — which is what a student saw as one
# notification on a four-class day.
#
# So the schedule is only used to *start* a worker, and the worker then pings
# on its own timer for the next forty minutes. Runs are started more often
# than they finish, so two or three overlap at any moment and it takes three
# consecutive dropped triggers before a gap appears. Overlap is harmless:
# every reminder is claimed in the database before it is sent, so whichever
# run gets there first is the only one that sends.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      once:
        description: "Ping once and stop, instead of looping"
        type: boolean
        default: true

# Deliberately no `concurrency:` group — overlapping workers are the whole
# point. Cancelling the previous one would reintroduce the gaps.

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Ping the reminder endpoint on a three-minute timer
        env:
          RECALL_URL: ${{ secrets.RECALL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ONCE: ${{ inputs.once }}
        run: |
          if [ -z "$RECALL_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the RECALL_URL and CRON_SECRET repository secrets."
            exit 1
          fi

          # Stop before the 50-minute job timeout so the run ends cleanly.
          DEADLINE=$(( $(date +%s) + 40 * 60 ))
          failures=0
          pings=0

          while :; do
            # 75s, not 60: the route's own budget is 60 and a cold start adds
            # to it, so a tighter timeout would report a failure that isn't one.
            response=$(curl -sS -w '\n%{http_code}' -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              --max-time 75 \
              "$RECALL_URL/api/cron/reminders" || echo $'\n000')

            body=$(echo "$response" | head -n -1)
            code=$(echo "$response" | tail -n 1)
            pings=$((pings + 1))

            echo "$(date -u '+%H:%M:%SZ')  HTTP $code  $body"

            if [ "$code" != "200" ]; then
              failures=$((failures + 1))
              # One bad response is a blip — Vercel cold starts, a Supabase
              # hiccup. Three in a row is an outage worth a red build.
              if [ "$failures" -ge 3 ]; then
                echo "::error::Three consecutive failed reminder runs (last: HTTP $code)"
                exit 1
              fi
            else
              failures=0
            fi

            # Spelled out rather than `[ ... ] && break`: GitHub runs these
            # steps under `set -e`, where a bare failing test at the end of a
            # loop body is a trap worth not setting.
            if [ "$ONCE" = "true" ]; then
              break
            fi

            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              break
            fi

            sleep 180
          done

          echo "Completed $pings ping(s)."
